<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <!-- DriverJagat mark: steering wheel, navy #0F3460 + kalo. Wordmark "Driver" navy, "Jagat" kalo. -->
  <g transform="translate(40, 25)">
    <circle cx="100" cy="100" r="84" fill="none" stroke="#0F3460" stroke-width="20"/>
    <circle cx="100" cy="100" r="46" fill="none" stroke="#000000" stroke-width="12"/>
    <circle cx="100" cy="100" r="14" fill="#0F3460"/>
    <line x1="100" y1="54" x2="100" y2="16" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    <line x1="60" y1="123" x2="27" y2="142" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    <line x1="140" y1="123" x2="173" y2="142" stroke="#000000" stroke-width="16" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="8" fill="#FFFFFF"/>
  </g>
  <text x="250" y="155" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="85" fill="#0F3460" letter-spacing="-2">Driver</text>
  <text x="503" y="155" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="85" fill="#000000" letter-spacing="-2">Jagat</text>
</svg>
