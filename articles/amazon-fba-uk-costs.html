    <h1>Amazon FBA UK: Where 30 to 50% of Your Selling Price Actually Goes</h1>
    <p class="standfirst">Most FBA guides show you the referral fee and stop. The sellers who fail are the ones who missed the storage surcharge, the fuel surcharge added in April 2026, and the VAT threshold that takes a sixth of revenue overnight. Here is the full stack, with a worked profit calculation on a real price point.</p>

<div class="takeaways">
<h2>The short version</h2>
<ul>
<li><b>Assume 30 to 50% of your selling price goes to Amazon</b> before you have paid for the product itself. Anything less is a pleasant surprise, not a plan.</li>
<li><b>Referral fees are typically 8% to 15%,</b> with a <b>&pound;1 minimum</b>. Amazon cut rates on cheaper items in 2026, to 5% under &pound;15 and 10% for clothing between &pound;15 and &pound;20.</li>
<li><b>A 1.5% fuel and logistics surcharge was added to UK FBA fulfilment fees from 17 April 2026.</b> It is small per unit and easy to forget in a spreadsheet built last year.</li>
<li><b>Long-term storage now bites sooner.</b> The threshold moved from 271 days to 241 days in February 2026, and stock sitting over a year can attract around <b>&pound;5.71 per cubic foot</b> in surcharges.</li>
<li><b>VAT is the real cliff edge.</b> UK-established sellers register at <b>&pound;90,000</b> rolling turnover. Overseas sellers holding UK stock have <b>no threshold at all</b> and must register from the first sale.</li>
</ul>
</div>

<h2 id="stack">1. The fee stack, in the order it hits you</h2>

<p>Amazon does not charge you one fee. It charges a sequence, and each one is calculated on a different thing, which is exactly why people underestimate the total.</p>

<table>
<tr><th>Cost</th><th>Roughly what it is</th><th>Charged on</th></tr>
<tr><td>Selling plan</td><td>A monthly subscription for the professional plan, or a per-item fee on the individual plan</td><td>Per month, or per item sold</td></tr>
<tr><td>Referral fee</td><td>Usually 8% to 15%, minimum &pound;1</td><td>Total sale price including shipping</td></tr>
<tr><td>FBA fulfilment fee</td><td>Pick, pack and delivery, by size and weight band</td><td>Per unit shipped</td></tr>
<tr><td>Fuel and logistics surcharge</td><td>1.5%, added from 17 April 2026</td><td>On top of the fulfilment fee</td></tr>
<tr><td>Monthly storage</td><td>Charged by volume in cubic feet, higher in the last quarter of the year</td><td>Per month of storage</td></tr>
<tr><td>Long-term storage</td><td>Surcharge once stock passes 241 days, steeper past a year</td><td>Aged inventory</td></tr>
<tr><td>Returns and removals</td><td>Return processing in some categories, plus removal or disposal fees</td><td>Per event</td></tr>
<tr><td>Advertising</td><td>Optional in theory, close to unavoidable in practice for a new listing</td><td>Per click</td></tr>
</table>

<p>Notice how many are per unit or per month rather than a percentage. That is the trap on low-priced products: the fixed elements do not shrink with your price, so a &pound;9 item can lose a far larger share of its value than a &pound;40 one.</p>

<div class="pullquote">The referral fee is the one everyone budgets for. The storage, surcharges and advertising are the ones that quietly decide whether you made money.</div>

<h2 id="changes">2. What changed in 2026</h2>

<p>Three changes matter if your numbers were built before this year.</p>

<p><strong>Fees came down on average.</strong> Amazon described 2026 as one of its largest fee reductions in European stores, averaging around 15p less per unit sold, with rate cuts on cheaper items. Referral fees dropped to 5% on items under &pound;15, and to 10% for clothing and accessories between &pound;15 and &pound;20. If you sell low-value items, this genuinely helps.</p>

<p><strong>A surcharge went the other way.</strong> From 17 April 2026 a 1.5% fuel and logistics surcharge applies to UK FBA fulfilment fees. Per unit it is pennies. Across thousands of units it is a line item you should have in the model.</p>

<p><strong>Aged stock gets punished sooner.</strong> The long-term storage threshold moved from 271 days to 241 days in February 2026. If you buy in bulk to chase a lower unit cost, that change shortens your runway by a month before penalties start.</p>

<div class="example" id="example">
<h3>Worked example: a &pound;24.99 product, line by line</h3>
<p>Standard-size item, roughly 500g, in a category with a 15% referral fee. Illustrative figures, not a quote, but the shape is realistic.</p>
<p><strong>Revenue:</strong> &pound;24.99</p>
<p><strong>Less referral fee at 15%:</strong> &minus;&pound;3.75<br>
<strong>Less FBA fulfilment fee (standard parcel):</strong> &minus;&pound;3.00<br>
<strong>Less 1.5% fuel and logistics surcharge:</strong> &minus;&pound;0.05<br>
<strong>Less monthly storage, apportioned per unit:</strong> &minus;&pound;0.15<br>
<strong>Less returns and write-off allowance, say 3%:</strong> &minus;&pound;0.75<br>
<strong>Less advertising at a modest 10% of revenue:</strong> &minus;&pound;2.50</p>
<p><strong>Amazon and selling costs total: about &pound;10.20, or 41% of the price.</strong></p>
<p>That leaves &pound;14.79 before you have paid for the product. If the unit landed cost including shipping and duty is &pound;7.50, your profit is <strong>&pound;7.29 a unit, around 29%</strong>.</p>
<p><strong>Now add VAT.</strong> Once registered, &pound;24.99 including VAT at 20% is only &pound;20.83 of revenue to you. Rerun the same costs and the profit falls to roughly <strong>&pound;3.75 a unit, about 15%</strong>. Nothing about the product changed. That is the single biggest number in this article.</p>
</div>

<h2 id="vat">3. The VAT cliff edge</h2>

<p>This catches more UK sellers than any fee.</p>

<p><strong>If you are UK-established,</strong> you must register once taxable turnover passes <strong>&pound;90,000 in any rolling 12 month period</strong>. Rolling, not per tax year, so it can arrive mid-month without warning if you are growing.</p>

<p><strong>If you are not UK-established but store stock in the UK,</strong> there is <strong>no threshold</strong>. You are required to register from the first sale, because the obligation attaches to holding stock here, not to how much you sell.</p>

<p>The effect on margin is brutal if you have not planned for it. On standard-rated goods, registration removes roughly a sixth of your revenue, about 16.7%, from the top. A business running on a 20% net margin can be close to breaking even the day it registers, unless prices move.</p>

<p>You do reclaim VAT on your own costs, including Amazon fees and stock purchased in the UK, which softens it. But if you import, or buy from non-VAT-registered suppliers, that offset is smaller than people expect. Many accountants recommend registering voluntarily before you approach the threshold, precisely so the pricing adjustment happens on your terms rather than on a deadline.</p>

<h2 id="capital">4. How much capital you actually need</h2>

<p>The honest answer is more than the courses suggest, because of one structural problem: <strong>you pay for stock long before Amazon pays you.</strong></p>

<p>Your money goes out when you place the purchase order. It comes back on Amazon's payout cycle, after the sale, minus fees, and often after a reserve period. On a product that takes 60 days to arrive and 60 days to sell through, you can be four months between spending and being paid.</p>

<p>A realistic minimum for a first private-label product is enough to cover: an initial order of a few hundred units, samples and testing, barcodes and photography, at least three months of advertising, and a second order placed before the first sells out. In practice that is thousands of pounds, not hundreds, and the second order is the part people forget.</p>

<p>The cheaper entry point is retail or online arbitrage, where you buy discounted stock from UK shops and resell it. Lower capital, far lower margins, much more of your own time, and no brand at the end of it. It is a genuine way to learn the platform. It is not a passive business.</p>

<h2 id="kills">5. What kills most new FBA sellers</h2>

<ol>
<li><strong>Modelling on the referral fee alone.</strong> A spreadsheet with only 15% in it will show profit on products that lose money.</li>
<li><strong>Ignoring the cash cycle.</strong> Profitable on paper, out of cash in month five, cannot fund the reorder, listing loses rank.</li>
<li><strong>Buying too deep, too early.</strong> Bulk pricing is tempting until aged stock passes 241 days and starts attracting surcharges on something that is not selling.</li>
<li><strong>Choosing a product because it looks easy.</strong> Easy to source means easy for everyone else, which means competing on price against sellers with more capital.</li>
<li><strong>Underestimating returns.</strong> Some categories run high return rates, and a returned item is not always resellable.</li>
<li><strong>Being surprised by VAT.</strong> Crossing &pound;90,000 with pricing built on pre-VAT margins is a self-inflicted wound.</li>
<li><strong>Treating advertising as optional.</strong> A new listing with no reviews and no ad spend is largely invisible.</li>
</ol>

<h2 id="fbm">6. FBA versus FBM: when self-fulfilment wins</h2>

<table>
<tr><th></th><th>FBA (Amazon fulfils)</th><th>FBM (you fulfil)</th></tr>
<tr><td>Prime eligibility</td><td>Automatic</td><td>Only via Seller Fulfilled Prime, with strict performance rules</td></tr>
<tr><td>Fees</td><td>Fulfilment, storage, surcharges</td><td>No FBA fees, but your own postage, packaging and time</td></tr>
<tr><td>Best for</td><td>Small, light, fast-moving items</td><td>Large, heavy, slow-moving or fragile items</td></tr>
<tr><td>Cash impact</td><td>Stock tied up in Amazon's warehouse</td><td>Stock at home, more control, no storage clock</td></tr>
<tr><td>Your time</td><td>Minimal per order</td><td>Every order is your job</td></tr>
</table>

<p>Bulky or slow-selling products are often the wrong fit for FBA, because storage is charged by volume and time. Running those yourself, or on a hybrid model, frequently beats paying Amazon to hold them.</p>

<h2 id="skip">7. Who should not do this</h2>

<p><strong>If the money is borrowed at high interest.</strong> The cash cycle is long and the first product often does not work. Debt with a monthly payment does not survive a four-month gap between spending and being paid.</p>

<p><strong>If you need income within three months.</strong> This is not that. Sourcing, shipping, listing and ranking take longer than any course video suggests. If you need money soon, look at our <a href="side-hustle-ideas-under-100-uk.html">side hustles under &pound;100 guide</a> instead.</p>

<p><strong>If you cannot handle admin.</strong> VAT returns, customs paperwork, product compliance and UKCA marking are all your responsibility, and getting them wrong is expensive.</p>

<p><strong>If you are relying on a course to pick your product.</strong> Any product a course promotes to thousands of students is, by definition, about to be saturated.</p>

<div class="verdict" id="verdict">
<h2>8. The honest verdict</h2>
<p>Amazon FBA is a real business with real margins, and the 2026 fee reductions genuinely help smaller-value products. It is not passive, it is not fast, and it is not cheap to start properly.</p>
<p>Build your model with every line in section one, not just the referral fee. Assume 30 to 50% of the price goes to Amazon. Then run the same model again as if you were VAT registered, because if this works you will be, and that version is the one that tells you whether the product is actually viable.</p>
<p>If it still profits after that, you have a product. If it only profits before VAT and before advertising, you have a hobby that will cost you money.</p>
</div>

<h2>Frequently asked</h2>

<p><strong>Do I need a limited company?</strong> Not to start. Many begin as a sole trader and incorporate later. The right answer depends on your other income and your plans, so it is worth an hour with an accountant rather than a forum thread.</p>

<p><strong>When do I have to register with HMRC?</strong> Trading income over &pound;1,000 in a tax year means registering for Self Assessment, as covered in our <a href="side-hustle-tax-rules-uk.html">side hustle tax guide</a>. VAT is separate and comes at &pound;90,000, or from the first sale if you hold UK stock without being UK-established.</p>

<p><strong>Is retail arbitrage still viable in the UK?</strong> Yes, but margins are thin, brand gating is common, and it is labour intensive. Treat it as a way to learn the platform cheaply rather than as the end goal.</p>

<p><strong>How long until profit?</strong> For a private-label product, realistically six to twelve months, and only if the first product works. Many sellers are on their second or third product before anything meaningful lands.</p>
