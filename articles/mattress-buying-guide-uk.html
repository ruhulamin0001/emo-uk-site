    <h1>You Will Spend 3,000 Hours a Year on It: How Much Should a Mattress Actually Cost?</h1>
    <p class="standfirst">Mattress pricing is deliberately confusing, the discounts are permanent, and the brand you have heard of is not necessarily the one you need. Here is what UK buyers should really spend in 2026, the one contract term that matters more than any spec, and the mistake that makes people buy twice.</p>

<div class="takeaways">
<h2>The short version</h2>
<ul>
<li><b>The sensible range is &pound;400 to &pound;700</b> for a double or king. Below roughly &pound;300 you are usually buying a replacement in three years, not a mattress.</li>
<li><b>The trial period matters more than the specification.</b> Treat 90 nights as the minimum. Several brands offer 200 nights or a full year.</li>
<li><b>You cannot judge a mattress in a showroom.</b> Give any new mattress 4 to 6 weeks before deciding. Your body genuinely needs that long to adjust.</li>
<li><b>Firmness follows your sleeping position,</b> not your preference in a shop. Side sleepers generally need softer, back and front sleepers firmer.</li>
<li><b>The permanent sale is not a sale.</b> If a mattress has been "50% off" for eight months, that is simply the price.</li>
</ul>
</div>

<h2 id="cost">1. What a mattress really costs per night</h2>

<p>Most household purchases are used for an hour a day. A mattress is used for seven or eight, every single night, for the best part of a decade. That is roughly 3,000 hours a year.</p>

<p>Run the cost that way and the numbers look different. A &pound;500 mattress that lasts eight years costs about <strong>17 pence a night</strong>. A &pound;250 one that sags after three years costs about <strong>23 pence a night</strong>, and you spent three years sleeping badly to save the difference.</p>

<p>That is the entire argument for spending properly once. It is not about luxury. It is about not paying twice.</p>

<div class="pullquote">A cheap mattress is rarely cheaper. It just moves the cost from this year to the year you replace it, and charges you interest in bad sleep.</div>

<h2 id="spend">2. How much to spend, by budget band</h2>

<table>
<tr><th>Budget (double or king)</th><th>What you get</th><th>Realistic lifespan</th></tr>
<tr><td>Under &pound;300</td><td>Thin foam or basic open-coil springs. Fine for a spare room or a short-term let. Tends to soften unevenly.</td><td>3 to 5 years</td></tr>
<tr><td>&pound;300 to &pound;500</td><td>Decent all-foam or entry hybrid. Genuinely usable as a main bed, especially for lighter sleepers.</td><td>7 to 10 years</td></tr>
<tr><td>&pound;500 to &pound;900</td><td>Quality hybrid with pocket springs and comfort layers. The best all-round choice for most UK adults.</td><td>8 to 10 years</td></tr>
<tr><td>&pound;900 and up</td><td>Better materials, edge support and cooling. Diminishing returns for most people, worth it for heavier sleepers or specific back issues.</td><td>10 years plus</td></tr>
</table>

<p>Most people are best served in the <strong>&pound;400 to &pound;700</strong> band. Below it you are gambling on how quickly it sags. Above it, the improvement per pound falls away quickly unless you have a specific need.</p>

<h2 id="trial">3. Why the trial period beats every spec</h2>

<p>You cannot tell whether a mattress suits you by lying on it in a shop for four minutes with your coat on. Nobody can. That is why the sleep trial is the single most valuable thing in the contract.</p>

<p>Treat <strong>90 nights as the minimum</strong>. Several established online brands offer <strong>200 nights or a full year</strong>, and that is the difference between a decision and a gamble.</p>

<p>Three things to check in the small print before you buy:</p>

<ol>
<li><strong>Is collection free?</strong> Some trials are generous until you try to send it back and discover a collection fee.</li>
<li><strong>Is there a minimum trial period first?</strong> Many require you to keep it 21 to 30 nights before you can return it, which is reasonable but worth knowing.</li>
<li><strong>Does a mattress protector void it?</strong> Occasionally the opposite: some require you to use one. Read it.</li>
</ol>

<p>Alongside the trial, note the warranty length, but do not confuse the two. A ten year warranty usually covers manufacturing faults and significant sagging, not "I do not like it".</p>

<h2 id="firm">4. Firmness: the mistake that makes people buy twice</h2>

<p>People choose firmness by what felt nice for two minutes in a showroom. The better approach is to choose by <strong>how you sleep</strong>.</p>

<ul>
<li><strong>Side sleepers</strong> generally need a softer surface, because shoulders and hips need to sink in for the spine to stay straight.</li>
<li><strong>Back sleepers</strong> usually want medium to medium-firm, enough support to keep the lower back from dipping.</li>
<li><strong>Front sleepers</strong> generally need firmer, because a soft mattress lets the hips drop and arches the lower back.</li>
<li><strong>Couples with different positions</strong> should look at medium-firm hybrids, or a zoned mattress, rather than compromising on one extreme.</li>
</ul>

<p>Body weight matters too. A heavier sleeper compresses a mattress more, so the "medium" that feels right for one person can feel soft for another. If you and your partner differ significantly in weight, edge support and zoning are worth paying for.</p>

<div class="verdict">
<h2>The 4 to 6 week rule</h2>
<p>A new mattress will often feel wrong for the first fortnight, especially if your old one had a dip you had unconsciously moulded to. Give any new mattress at least four weeks, ideally six, before judging it. This is exactly why a 90 night trial is the minimum worth accepting: a 30 night trial can expire before your body has finished adjusting.</p>
</div>

<h2 id="types">5. Foam, spring or hybrid, in plain English</h2>

<p><strong>All-foam.</strong> Memory foam or similar. Excellent at absorbing movement, so good if your partner turns over a lot. Can sleep warm, and cheaper foams soften faster.</p>

<p><strong>Pocket sprung.</strong> Individual springs in fabric pockets. Breathable, supportive, and generally better for heavier sleepers. Spring count is heavily marketed and above roughly 1,000 in a king it stops meaning much.</p>

<p><strong>Hybrid.</strong> Pocket springs with foam or latex comfort layers on top. This is where most of the sensible money goes because it combines airflow with pressure relief.</p>

<p><strong>Open coil.</strong> One connected spring unit. Cheap, and it is the type most likely to sag in the middle. Fine for a spare room, not for eight years of nightly use.</p>

<h2 id="marketing">6. What is pure marketing</h2>

<p><strong>Enormous spring counts.</strong> Past a point, more springs means thinner, weaker springs. It is a number for the advert, not for your back.</p>

<p><strong>Permanent discounts.</strong> Online mattress prices are almost always "reduced". If the sale never ends, the sale price is the real price. Judge it on what you pay, never on the crossed-out number.</p>

<p><strong>Orthopaedic and medical sounding names.</strong> These are not regulated terms in the way people assume. "Orthopaedic" mostly means firm. If you have a genuine back condition, ask a physiotherapist rather than a marketing department.</p>

<p><strong>Cooling gel claims.</strong> A little help at the surface, rarely the transformation described. Airflow from springs and a breathable cover does more.</p>

<div class="example" id="example">
<h3>Worked example: Dan and Aisha replace a 12-year-old bed</h3>
<p>Their old mattress has a visible dip and Dan wakes with lower back ache. They have &pound;600 and are tempted by a &pound;250 special offer that would leave money for a new frame.</p>
<p>They run the per-night sum instead. The &pound;250 mattress, realistically 4 years, is <strong>17p a night</strong>. A &pound;550 hybrid at 9 years is <strong>17p a night</strong> too, for a considerably better bed. The cheap option saves nothing over time, it only delays the spending.</p>
<p>They choose the &pound;550 hybrid, medium-firm because Aisha sleeps on her side and Dan on his back, from a retailer with a 200 night trial and free collection. Week two is uncomfortable and they nearly send it back. By week five the back ache has gone.</p>
<p>The frame waits until next year. The mattress was the part that affects 3,000 hours; the frame mostly affects how the room looks.</p>
</div>

<h2 id="skip">7. When not to buy a new mattress</h2>

<p><strong>If the mattress is under three years old and the problem is the base.</strong> A sagging divan or broken slats will ruin a good mattress. Check the base first, it is far cheaper to fix.</p>

<p><strong>If you have not tried rotating it.</strong> Many mattresses need rotating every few months, especially in the first year. A surprising number of "worn out" mattresses are just unevenly settled.</p>

<p><strong>If money is genuinely tight this month.</strong> A good mattress topper at &pound;50 to &pound;120 can buy you a year of better sleep while you save properly. It is a delay tactic, not a fix, but it is an honest one.</p>

<p><strong>If you would put it on a credit card you cannot clear.</strong> Interest will cost more than the upgrade you were reaching for, as covered in our <a href="best-cashback-credit-cards-uk.html">cashback card guide</a>.</p>

<div class="verdict" id="verdict">
<h2>8. The honest verdict</h2>
<p>Spend &pound;400 to &pound;700 on a hybrid, choose firmness by how you sleep rather than how it feels in a shop, and insist on a trial of at least 90 nights with free collection. That combination gets the overwhelming majority of UK buyers a bed that lasts eight to ten years.</p>
<p>Ignore spring counts, ignore permanent sales, and ignore anything described as orthopaedic unless a clinician said the word first.</p>
<p>And whatever you buy, give it six weeks. The most common mistake is not buying the wrong mattress. It is returning the right one too early.</p>
</div>

<h2>Frequently asked</h2>

<p><strong>How often should a mattress be replaced?</strong> Commonly quoted as seven to eight years, but condition matters more than age. Visible sagging, waking stiff, or sleeping better away from home are the real signals.</p>

<p><strong>Are mattress-in-a-box brands any good?</strong> Many are, and their trial periods are usually the most generous. Allow 24 to 72 hours for one to fully expand before judging it.</p>

<p><strong>Can I return a mattress I simply do not like?</strong> Under the trial, usually yes. Under standard online distance selling rules there is normally a 14 day right to change your mind, though hygiene exceptions can apply once unsealed, which is exactly why the brand's own trial matters.</p>

<p><strong>Does a topper fix a sagging mattress?</strong> No. A topper changes the surface feel, it cannot restore support that has collapsed underneath. It buys time, nothing more.</p>
