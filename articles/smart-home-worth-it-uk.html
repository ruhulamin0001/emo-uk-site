    <h1>Smart Heating: The Adverts Say 30%, UK Homes Get 8 to 15%</h1>
    <p class="standfirst">Smart thermostats are sold on a saving that most households never actually see. Here is what the Energy Saving Trust and the manufacturers' own data really show, how long a &pound;200 thermostat takes to pay for itself, and the free adjustment that beats every gadget in this article.</p>

<div class="takeaways">
<h2>The short version</h2>
<ul>
<li><b>The free change first.</b> Turning your thermostat down by 1&deg;C typically cuts heating costs by around <b>10%</b>, according to the Energy Saving Trust. That costs nothing and beats most gadgets.</li>
<li><b>Marketing says 15 to 30%. Real UK homes see 8 to 15%.</b> One manufacturer's own customer data showed an average gas reduction of about <b>6%</b> in the year after installing.</li>
<li><b>The Energy Saving Trust puts heating controls at roughly &pound;75 to &pound;150 a year</b> for a typical home, sometimes more in a large or badly controlled house.</li>
<li><b>Payback is usually 2 to 3 years,</b> not the few months the adverts imply.</li>
<li><b>Smart radiator valves are the bigger win</b> in homes with rooms nobody uses. The thermostat alone cannot heat one room and not another.</li>
</ul>
</div>

<h2 id="free">1. Do this before you spend anything</h2>

<p>The Energy Saving Trust's figure is blunt: dropping your thermostat by <strong>1&deg;C usually cuts heating costs by around 10%</strong>. On a &pound;1,200 annual heating bill that is roughly &pound;120 a year, for free, today, with no installation and no app.</p>

<p>Alongside that, three other free adjustments do more than most hardware. Set your heating schedule to match when you are actually home rather than running all day. Turn radiators down in rooms you do not use. And check your hot water is not heating around the clock when you only need it twice a day.</p>

<p>Do those first. Then, if you still want automation, at least you will be measuring the gadget against a sensible baseline rather than against years of waste.</p>

<div class="pullquote">A smart thermostat does not save energy. It makes it easier to do things that save energy. If you were already doing them, it saves you very little.</div>

<h2 id="claims">2. The claim gap: advertised versus measured</h2>

<p>The major systems advertise savings of roughly <strong>15% to 30%</strong> compared with a manual thermostat. Independent real-world testing in UK homes tends to land nearer <strong>8% to 15%</strong>.</p>

<p>More telling is the manufacturers' own data. One large UK provider found its customers showed an average <strong>6% reduction in gas consumption</strong> in the year after installation. That is a genuine saving, and it is a fraction of the headline.</p>

<p>Why the gap? Because the advertised figure compares a smart system against a badly managed home. If your heating currently runs on a timer you set once in 2019, you will do well. If you already turn things down and off, the system has little left to find.</p>

<h2 id="payback">3. The payback maths, honestly</h2>

<p>A smart thermostat costs roughly &pound;150 to &pound;250 for the unit, plus installation if you are not comfortable with mains wiring. Call it &pound;200 to &pound;350 all in.</p>

<p>Against a saving of &pound;75 to &pound;150 a year, payback lands somewhere between <strong>18 months and four years</strong>, with two to three years being the realistic middle. That is still a good return compared with most household purchases. It is simply not the few-months miracle the packaging suggests.</p>

<p>Two things push payback the right way: a larger house, and a household with irregular hours where heating an empty home is the current default. Two things push it the wrong way: a small well-insulated flat, and a household that is already careful.</p>

<h2 id="trvs">4. Why smart radiator valves often beat the thermostat</h2>

<p>A thermostat measures one room and controls the whole house. If your hallway sensor is happy, the spare bedroom and the empty dining room are being heated too, all winter.</p>

<p>Smart thermostatic radiator valves (TRVs) fix that by controlling each radiator separately, so you heat the rooms you are in. In one documented case, a three-bedroom Victorian house fitted with eight smart TRVs saw heating costs fall by around <strong>22%</strong>, far above the average.</p>

<p>The catch is cost. Smart TRVs run roughly &pound;50 to &pound;80 each, so eight of them is &pound;400 to &pound;640 on top of the thermostat. The saving is real, but so is the outlay, and payback stretches accordingly.</p>

<p>The sensible middle path is to fit smart TRVs only in the rooms you genuinely underuse, typically a spare bedroom, a dining room and a hallway. Three valves at &pound;180 solving the biggest waste beats eight valves solving every room.</p>

<div class="example" id="example">
<h3>Worked example: the Ahmed family, three-bed semi</h3>
<p>Annual heating bill roughly &pound;1,100. Both adults work out of the house three days a week, and the heating currently runs on a fixed timer regardless. Two rooms are rarely used.</p>
<p><strong>Step one, free:</strong> thermostat down 1&deg;C and the schedule matched to actual occupancy. Estimated saving around <strong>&pound;140 a year</strong>. Cost: nothing.</p>
<p><strong>Step two, &pound;220:</strong> a smart thermostat so the heating follows their changing week rather than a fixed timer. Estimated additional saving around <strong>&pound;90 a year</strong>. Payback: roughly two and a half years.</p>
<p><strong>Step three, &pound;180:</strong> three smart TRVs on the two unused rooms and the hallway. Estimated additional saving around <strong>&pound;70 a year</strong>. Payback: roughly two and a half years again.</p>
<p><strong>The lesson:</strong> the free step saved more than either purchase. The hardware is worth buying, but only after the behaviour change, and only in a house where there is genuine waste to remove.</p>
</div>

<h2 id="worth">5. What is genuinely worth buying</h2>

<ol>
<li><strong>A smart thermostat,</strong> if your current control is a basic timer and your week is irregular. This is the one with a real payback.</li>
<li><strong>Smart TRVs in underused rooms only.</strong> Targeted, not whole-house, unless money is no object.</li>
<li><strong>A smart plug with energy monitoring,</strong> around &pound;12 to &pound;20. It will not save much by itself, but it tells you what is actually costing you, which is worth more than a guess.</li>
<li><strong>Draught proofing.</strong> Not smart, not exciting, and pound for pound usually the best return in the whole house. Covered in our <a href="cut-energy-bills-uk.html">energy bills guide</a>.</li>
</ol>

<h2 id="gadgets">6. What you will stop using within a month</h2>

<p><strong>Colour-changing bulbs everywhere.</strong> Fun for a fortnight, then you set them to white and forget the app exists. Standard LED bulbs already cut lighting costs; the smart part adds cost, not saving.</p>

<p><strong>Voice assistants as an energy tool.</strong> Convenient, but asking a speaker to turn the heating down saves exactly the same as walking to the dial.</p>

<p><strong>Smart kettles and smart fridges.</strong> The appliance uses the same electricity either way. You are paying for an app.</p>

<p><strong>Whole-house sensor kits bought before insulation.</strong> Measuring a draughty house very precisely does not make it warmer.</p>

<h2 id="skip">7. Who should not bother</h2>

<p><strong>If you rent.</strong> Check with your landlord before changing anything mains-wired. Smart TRVs and plugs are usually fine and can move with you; a thermostat generally cannot.</p>

<p><strong>If you live in a small, well-insulated flat.</strong> There is often not enough heating cost to save on, and payback can stretch beyond the life of the gadget.</p>

<p><strong>If you are already careful.</strong> If your heating is scheduled sensibly and set at 18 to 19&deg;C, a smart thermostat is buying convenience, not savings. That is a fine reason to buy one, just be honest that it is the reason.</p>

<p><strong>If your home is draughty or poorly insulated.</strong> Fix that first. Controlling heat that escapes through the loft is expensive precision.</p>

<div class="verdict" id="verdict">
<h2>8. The honest verdict</h2>
<p>Smart heating is worth it for a specific household: a medium or large home, an irregular schedule, basic existing controls, and rooms that go unused. There, the combination of a smart thermostat and a few targeted radiator valves pays for itself in two to three years and keeps paying.</p>
<p>It is not worth it as a first move. The free 1&deg;C adjustment and a sensible schedule will save more than the thermostat does, and cost nothing at all.</p>
<p>Buy the control, not the gadget. Then ignore every advert that promises 30%.</p>
</div>

<h2>Frequently asked</h2>

<p><strong>Do smart thermostats work with any boiler?</strong> Most modern combi and system boilers are fine, but compatibility varies, especially with older or heat-only systems. Check the manufacturer's compatibility tool before buying.</p>

<p><strong>Can I fit one myself?</strong> Battery-powered TRVs and plugs, yes. Anything wired into mains or the boiler should be done by a qualified electrician or heating engineer, both for safety and for your warranty.</p>

<p><strong>Does turning the heating off completely save more than leaving it low?</strong> For most UK homes, heating only when you need it saves more than leaving it on low all day. The exception is a very poorly insulated home in deep cold, where the difference narrows.</p>

<p><strong>What temperature should I set?</strong> The usual guidance is 18 to 21&deg;C in living areas, at the lower end if comfortable. Every degree down is roughly 10% off the heating cost.</p>
