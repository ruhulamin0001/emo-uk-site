[project]
name = "ai-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "websockets>=13,<15",
  "numpy>=1.26",
  "scipy>=1.11",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "openai>=1.50",
]
[project.optional-dependencies]
pipeline = ["elevenlabs>=1.0", "deepgram-sdk>=3.7", "anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["bridge*"]
