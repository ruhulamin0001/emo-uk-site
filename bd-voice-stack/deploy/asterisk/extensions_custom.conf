; Installed by scripts/05_routing.sh into /etc/asterisk/extensions_custom.conf
;
; Facts verified against Asterisk 21 source (apps/app_audiosocket.c, res/res_audiosocket.c):
;  1. AudioSocket() validates its first argument with uuid_parse(), so it MUST be a real UUID.
;     ${UNIQUEID} (1693000000.12) is rejected. We use ${UUID()} (funcs/func_uuid.c, in 21).
;  2. AudioSocket() sets no AUDIOSOCKET_STATUS variable. It returns -1 on failure, and a bare -1
;     hangs the channel up. TryExec() turns that into TRYSTATUS=FAILED and lets us fall back.
;  3. When the bridge sends the 0x00 hangup frame, AudioSocket() returns 0 and the dialplan
;     continues. The bridge sets TRANSFER_TARGET (via AMI Setvar) before it hangs up the socket,
;     so a human transfer is a plain Goto here. No mid-app Redirect needed.
;  4. The bridge finds the channel by the UUID through the AstDB key aibridge/<uuid> which we
;     write here and delete on hangup.

[ai-agent]
; Custom Destination / inbound route target: ai-agent,bizN,1
exten => _biz.,1,NoOp(AI agent for ${EXTEN} DID=${FROM_DID} CID=${CALLERID(num)})
 same => n,Answer()
 same => n,Set(BIZ=${EXTEN})
 same => n,Set(AI_UUID=${UUID()})
 same => n,Set(TRANSFER_TARGET=)
 same => n,Set(DB(aibridge/${AI_UUID})=${CHANNEL})
 same => n,Set(CHANNEL(hangup_handler_push)=ai-agent-cleanup,s,1)
 same => n,Set(CALLFILENAME=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${EXTEN}-${CALLERID(num)}-${UNIQUEID})
 same => n,MixMonitor(${CALLFILENAME}.wav,b)
 same => n,Wait(0.2)
 same => n,TryExec(AudioSocket(${AI_UUID},127.0.0.1:9092))
 same => n,NoOp(AudioSocket ended TRYSTATUS=${TRYSTATUS} TRANSFER_TARGET=${TRANSFER_TARGET})
 same => n,Set(DB_DELETE(aibridge/${AI_UUID})=)
 same => n,GotoIf($["${TRANSFER_TARGET}" != ""]?xfer)
 same => n,GotoIf($["${TRYSTATUS}" != "SUCCESS"]?fallback)
 same => n,Hangup()
 same => n(xfer),NoOp(transfer to human ${TRANSFER_TARGET})
 same => n,Goto(from-internal,${TRANSFER_TARGET},1)
 same => n(fallback),NoOp(bridge down or failed, falling back to human ring group)
 same => n,Goto(ai-fallback,${EXTEN},1)

[ai-agent-cleanup]
exten => s,1,NoOp(cleanup aibridge/${AI_UUID})
 same => n,Set(DB_DELETE(aibridge/${AI_UUID})=)
 same => n,Return()

[ai-fallback]
exten => biz1,1,Goto(from-internal,601,1)
exten => biz2,1,Goto(from-internal,602,1)
exten => biz3,1,Goto(from-internal,603,1)
exten => biz4,1,Goto(from-internal,604,1)
exten => biz5,1,Goto(from-internal,605,1)
